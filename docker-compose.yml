services:
  keyway:
    build: .
    ports: ["8080:8080"]
    security_opt: [seccomp:unconfined]  # io_uring requires unconfined seccomp
    env_file:
      - path: .env
        required: false

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes: ["./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.5.2
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards-json:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
