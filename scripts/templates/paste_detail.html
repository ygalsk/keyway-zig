<div class="page-header page-header-paste">
  <h1><%= paste_title or "untitled" %></h1>
  <p>
    Paste <code><%= paste_id %></code>
    &middot; <%= paste_views %> view<%= paste_views ~= 1 and "s" or "" %>
    <% if paste_created then %>&middot; <%= paste_created %><% end %>
    &middot; <a href="/paste/<%= paste_id %>/raw">Raw</a>
    &middot; <a href="/paste">Back</a>
  </p>
</div>

<div class="card">
  <pre><code><%= paste_content %></code></pre>
</div>
