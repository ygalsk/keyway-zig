<div class="page-header">
  <h1>DNS Lookup</h1>
  <p>Resolve a domain name to its A records via live DNS query</p>
</div>

<div class="card">
  <h2>Lookup a Domain</h2>
  <form method="POST" action="/dns">
    <div class="form-group">
      <label for="domain">Domain</label>
      <input type="text" id="domain" name="domain" placeholder="example.com"
             value="<%= domain or '' %>" required>
    </div>
    <button type="submit" class="btn btn-primary">Lookup</button>
  </form>
</div>

<% if error_msg then %>
<div class="banner-error"><%= error_msg %></div>
<% end %>

<% if records then %>
<div class="card">
  <h2>A Records for <code><%= domain %></code></h2>
  <table class="data-table">
    <tr>
      <th>IP Address</th>
    </tr>
    <% for _, ip in ipairs(records) do %>
    <tr>
      <td style="color: var(--accent);"><%= ip %></td>
    </tr>
    <% end %>
  </table>
</div>
<% end %>
