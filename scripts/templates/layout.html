<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    <%= title or "Keyway" %>
  </title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <nav>
    <a href="/" class="brand<% if page == 'home' then %> active<% end %>">Keyway</a>
    <a href="/kv" <% if page=='kv' then %> class="active"<% end %>>KV Store</a>
    <a href="/probe"<% if page == 'probe' then %> class="active"<% end %>>Probe</a>
    <a href="/hooks"<% if page == 'hooks' or page == 'hook_detail' then %> class="active"<% end %>>Hooks</a>
    <a href="/dns"<% if page == 'dns' then %> class="active"<% end %>>DNS</a>
  </nav>

  <% if error_msg then %>
    <div class="container">
      <div class="banner-error">
        <%= error_msg %>
      </div>
    </div>
    <% end %>

      <% if success_msg then %>
        <div class="container">
          <div class="banner-success">
            <%= success_msg %>
          </div>
        </div>
        <% end %>

          <main class="container" style="padding-top: var(--space-6); padding-bottom: var(--space-6);">
            <%- content %>
          </main>

          <footer class="worker-badge">
            Worker <%= worker_id %>
          </footer>
</body>

</html>
