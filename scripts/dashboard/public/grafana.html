<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keyway Metrics</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #111217; }
  iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
<iframe id="gf" src="/__keyway/grafana/d/keyway/keyway?kiosk" allowfullscreen></iframe>
<script>
// Block Escape key on parent page
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); }
}, true);

// Block Escape key inside the iframe (same-origin via reverse proxy)
document.getElementById('gf').addEventListener('load', function() {
  try {
    this.contentDocument.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); }
    }, true);
  } catch(e) {}
});
</script>
</body>
</html>
